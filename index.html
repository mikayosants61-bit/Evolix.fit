<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evolix.fit</title>
<style>
:root{--bg:#F5F7FA;--card:#fff;--ink:#101923;--mute:#64748B;--line:#E2E8F0;--acc:#A3F765;--bar:#101923;--err:#B42318;--ok:#157F3B}
@media(prefers-color-scheme:dark){:root{--bg:#0B121A;--card:#101923;--ink:#F5F7FA;--mute:#94A3B8;--line:#223142;--bar:#0B121A;--err:#FDA29B;--ok:#86E3A3}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--bar);color:#fff;display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:21px}.logo b{color:var(--acc)}
#who{margin-left:auto;font-size:14px;opacity:.85}
nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line)}
nav button{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);padding:10px 14px;min-height:44px;font:inherit;cursor:pointer}
nav button[aria-current=page]{color:var(--ink);font-weight:700;border-color:var(--acc)}
main{max-width:900px;margin:0 auto;padding:16px}
h2{margin:6px 0 12px;font-size:22px}h3{margin:0 0 6px;font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--mute);margin-bottom:10px}
input,select{width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin-top:4px}
input[type=checkbox]{width:28px;min-height:28px;margin:0}
.btn{min-height:44px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn.p{background:var(--acc);color:#101923;border-color:var(--acc)}.btn.d{color:var(--err)}.btn:disabled{opacity:.5}
:focus-visible{outline:3px solid #3B82F6;outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.mute{color:var(--mute);font-size:14px}.tag{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--mute)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.set{display:grid;grid-template-columns:24px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:6px}
.empty{text-align:center;color:var(--mute);padding:20px}
#timer{display:none;position:sticky;bottom:8px;margin:0 16px;background:var(--bar);color:#fff;border-radius:12px;padding:12px 16px;justify-content:space-between;align-items:center}#timer.on{display:flex}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;z-index:9;max-width:90vw}
code{word-break:break-all;background:var(--bg);padding:2px 6px;border-radius:6px;font-size:13px}
</style>
</head>
<body>
<header><div class="logo">Evolix<b>.fit</b></div><span id="who"></span><button class="btn" id="out" style="display:none;min-height:36px;padding:4px 12px">Sair</button></header>
<nav id="nav" aria-label="Seções"></nav>
<main id="app">Carregando…</main>
<div id="timer" role="timer"><span id="tl"></span><button class="btn" data-act="tstop">Pular</button></div>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* Preencha com a URL e a chave ANON (pública) do seu projeto Supabase. NUNCA use a service_role aqui. */
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";

const ls={g:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const cfg={url:SUPABASE_URL||ls.g("evx_url"),key:SUPABASE_ANON_KEY||ls.g("evx_key")};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const RP={owner:"Dono",manager:"Gestor",trainer:"Personal",student:"Aluno"};
const fmt=s=>Math.floor(s/60)+":"+String(Math.max(0,Math.floor(s%60))).padStart(2,"0");
let sb,U={mode:"login",user:null,mems:[],org:null,tab:null,b:null,s:null,plans:[],lib:[]};
const oid=()=>U.org.org_id, staff=()=>["owner","manager"].includes(U.org.role), trainer=()=>U.org.role!=="student";
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3500)}
async function q(p){const r=await p;if(r.error){const m=r.error.message||"";
 toast(/row-level security|permission denied/i.test(m)?"Sem permissão para esta ação.":/foreign key/i.test(m)?"Registro não encontrado. Confira o ID.":/duplicate key|already/i.test(m)?"Esse registro já existe.":/limit_reached/.test(m)?"Limite de organizações atingido.":/version_empty/.test(m)?"Adicione ao menos um exercício antes de publicar.":m);throw r.error}return r.data}
const show=h=>{$("#app").innerHTML=h;};

function cfgScreen(){return `<div class="card"><h2>Conectar ao Supabase</h2><p class="mute">Cole a URL do projeto e a chave <b>anon public</b> (Settings &gt; API). Nunca cole a chave service_role.</p><form data-form="cfg"><label>URL do projeto<input name="u" required placeholder="https://xxxx.supabase.co"></label><label>Chave anon public<input name="k" required></label><button class="btn p">Salvar e conectar</button></form></div>`}
function authScreen(){const su=U.mode==="signup";return `<div class="card"><h2>${su?"Criar conta":"Entrar"}</h2><form data-form="auth">${su?`<label>Nome<input name="name" required maxlength="120" autocomplete="name"></label>`:""}<label>E-mail<input name="email" type="email" required autocomplete="email"></label><label>Senha (mínimo 8 caracteres)<input name="pw" type="password" required minlength="8" autocomplete="${su?"new-password":"current-password"}"></label><div class="row"><button class="btn p">${su?"Criar conta":"Entrar"}</button><button type="button" class="btn" data-act="mode">${su?"Já tenho conta":"Criar conta nova"}</button></div></form></div>`}

async function init(){
 if(!cfg.url||!cfg.key){$("#nav").innerHTML="";return show(cfgScreen())}
 sb=supabase.createClient(cfg.url,cfg.key);
 const {data}=await sb.auth.getSession();U.user=data.session?data.session.user:null;route();
}
async function route(){
 $("#nav").innerHTML="";$("#out").style.display=U.user?"":"none";
 if(!U.user){$("#who").textContent="";return show(authScreen())}
 $("#who").textContent=(U.user.user_metadata&&U.user.user_metadata.full_name)||U.user.email;
 try{U.mems=await q(sb.from("organization_members").select("org_id,role,organizations(name)").eq("user_id",U.user.id).eq("active",true))}catch(e){return}
 U.org=U.mems.find(m=>U.org&&m.org_id===U.org.org_id)||U.mems[0]||null;
 if(!U.org){U.tab="conta";return nav()}
 if(!U.tab||!tabs().some(t=>t[0]===U.tab))U.tab=tabs()[0][0];
 nav();
}
const tabs=()=>(U.org?(trainer()?[["plans","Treinos"],["team",staff()?"Equipe e alunos":"Meus alunos"]]:[["mine","Meu treino"],["hist","Histórico"]]):[]).concat([["conta","Conta"]]);
function nav(){$("#nav").innerHTML=tabs().map(t=>`<button data-act="tab" data-v="${t[0]}" ${U.tab===t[0]?'aria-current="page"':""}>${t[1]}</button>`).join("");view()}
async function view(){
 show("Carregando…");
 try{show(await ({conta:vConta,team:vTeam,plans:vPlans,mine:vMine,hist:vHist}[U.tab])())}catch(e){console.error(e);show(`<div class="card empty">Não foi possível carregar. Verifique a conexão e as migrations do banco.</div>`)}
}
async function vConta(){
 return `<h2>Conta</h2><div class="card"><p>${esc(U.user.email)}</p><p class="mute">Seu ID (envie ao gestor da academia para ser adicionado):</p><code>${U.user.id}</code></div>`+
 (U.mems.length>1?`<div class="card"><label>Organização ativa<select data-org>${U.mems.map(m=>`<option value="${m.org_id}" ${m.org_id===U.org.org_id?"selected":""}>${esc(m.organizations.name)} (${RP[m.role]})</option>`).join("")}</select></label></div>`:"")+
 `<div class="card"><h3>${U.org?"Criar outra academia ou consultório":"Você ainda não faz parte de nenhuma organização"}</h3><p class="mute">${U.org?"":"Crie a sua, ou envie seu ID acima para quem administra uma academia."}</p><form data-form="org"><label>Nome<input name="n" required minlength="2" maxlength="120"></label><button class="btn p">Criar organização</button></form></div>`;
}
async function vTeam(){
 const ms=await q(sb.from("organization_members").select("user_id,role,active,profiles(full_name)").eq("org_id",oid()).order("created_at"));
 const rel=staff()?await q(sb.from("trainer_student_relationships").select("trainer_id,student_id,active").eq("org_id",oid())):[];
 const nm=id=>{const m=ms.find(x=>x.user_id===id);return esc((m&&m.profiles&&m.profiles.full_name)||"Sem nome")};
 const trs=ms.filter(m=>m.active&&["owner","manager","trainer"].includes(m.role));
 return `<h2>${staff()?"Equipe e alunos":"Meus alunos"}</h2>`+
 (staff()?`<form class="card" data-form="member"><h3>Adicionar pessoa</h3><p class="mute">A pessoa cria a conta, abre Conta e envia o ID para você.</p><div class="row"><label style="flex:2;min-width:220px;margin:0">ID da pessoa<input name="id" required pattern="[0-9a-fA-F-]{36}"></label><label style="flex:1;margin:0">Função<select name="role"><option value="student">Aluno</option><option value="trainer">Personal</option><option value="manager">Gestor</option></select></label><button class="btn p" style="align-self:end">Adicionar</button></div></form>`:"")+
 ms.map(m=>{const links=rel.filter(r=>r.student_id===m.user_id&&r.active).map(r=>nm(r.trainer_id)).join(", ");
 return `<div class="card"><div class="row sp"><div><h3>${nm(m.user_id)} <span class="tag">${RP[m.role]}</span> ${m.active?"":'<span class="tag">inativo</span>'}</h3>${m.role==="student"&&staff()?`<span class="mute">Personal: ${links||"nenhum vinculado"}</span>`:""}</div>
 ${staff()&&m.role!=="owner"?`<div class="row">${m.role==="student"&&m.active?`<select data-trsel="${m.user_id}" aria-label="Personal">${trs.map(t=>`<option value="${t.user_id}">${nm(t.user_id)}</option>`).join("")}</select><button class="btn" data-act="link" data-v="${m.user_id}">Vincular</button>`:""}<button class="btn ${m.active?"d":""}" data-act="toggle" data-v="${m.user_id}" data-a="${m.active}">${m.active?"Desativar":"Reativar"}</button></div>`:""}</div></div>`}).join("")||`<div class="card empty">Nenhuma pessoa ainda.</div>`;
}
async function vPlans(){
 if(U.b)return vBuilder();
 const ms=await q(sb.from("organization_members").select("user_id,role,profiles(full_name)").eq("org_id",oid()).eq("role","student").eq("active",true));
 const nm=id=>{const m=ms.find(x=>x.user_id===id);return esc((m&&m.profiles&&m.profiles.full_name)||"Sem nome")};
 U.plans=await q(sb.from("workout_plans").select("id,name,goal,notes,student_id,workout_plan_versions(version,status)").eq("org_id",oid()).order("created_at",{ascending:false}));
 return `<h2>Treinos</h2>`+(ms.length?`<form class="card" data-form="plan"><h3>Novo treino</h3><div class="row"><label style="flex:1;min-width:160px;margin:0">Aluno<select name="s">${ms.map(m=>`<option value="${m.user_id}">${nm(m.user_id)}</option>`).join("")}</select></label><label style="flex:2;min-width:200px;margin:0">Nome do treino<input name="n" required maxlength="120"></label><button class="btn p" style="align-self:end">Criar</button></div></form>`:`<div class="card empty">Nenhum aluno disponível. ${staff()?"Adicione alunos na aba Equipe.":"Peça ao gestor para vincular alunos a você."}</div>`)+
 (U.plans.map(p=>{const vs=p.workout_plan_versions||[],l=vs.reduce((a,b)=>b.version>a.version?b:a,{version:0,status:""});
 return `<div class="card row sp"><div><h3>${esc(p.name)}</h3><span class="mute">${nm(p.student_id)} · v${l.version} ${l.status==="published"?"publicada":l.status==="draft"?"rascunho":"arquivada"}</span></div><button class="btn" data-act="open" data-v="${p.id}">Abrir</button></div>`}).join("")||"");
}
async function openPlan(id){
 const vs=await q(sb.from("workout_plan_versions").select("id,version,status,workout_plan_items(position,exercise_id,sets,reps,prescribed_load_kg,rest_seconds,exercise_library(name))").eq("plan_id",id).order("version",{ascending:false}));
 const v=vs.find(x=>x.status==="draft")||vs[0],p=U.plans.find(x=>x.id===id);
 if(!U.lib.length)U.lib=await q(sb.from("exercise_library").select("id,name,muscle_group").order("muscle_group").order("name"));
 U.b={plan:id,name:p.name,goal:p.goal,notes:p.notes,vid:v.id,v:v.version,status:v.status,items:v.workout_plan_items.sort((a,b)=>a.position-b.position).map(i=>({ex:i.exercise_id,name:i.exercise_library?i.exercise_library.name:"Exercício",sets:i.sets,reps:i.reps,load:i.prescribed_load_kg??"",rest:i.rest_seconds}))};
 view();
}
function vBuilder(){const b=U.b,ro=b.status!=="draft",gs=[...new Set(U.lib.map(e=>e.muscle_group))];
 return `<button class="btn" data-act="back">Voltar</button><h2>${esc(b.name)} <span class="tag">${ro?"v"+b.v+" publicada":"rascunho v"+b.v}</span></h2>`+
 (ro?`<div class="card"><p class="mute">Uma versão publicada não pode ser editada. Crie uma nova versão para alterar; a anterior fica no histórico.</p><button class="btn p" data-act="newver">Criar nova versão</button></div>`:
 `<div class="card"><label>Nome<input data-b="name" value="${esc(b.name)}" maxlength="120"></label><label>Objetivo<input data-b="goal" value="${esc(b.goal)}" maxlength="200"></label><label>Observações para o aluno<input data-b="notes" value="${esc(b.notes)}" maxlength="500"></label></div>`)+
 (b.items.length?b.items.map((it,i)=>`<div class="card"><div class="row sp"><strong>${i+1}. ${esc(it.name)}</strong>${ro?"":`<span class="row"><button class="btn" data-act="up" data-v="${i}" ${i?"":"disabled"}>Subir</button><button class="btn" data-act="dn" data-v="${i}" ${i<b.items.length-1?"":"disabled"}>Descer</button><button class="btn d" data-act="rm" data-v="${i}">Remover</button></span>`}</div><div class="g4" style="margin-top:8px"><label>Séries<input type="number" min="1" max="20" data-i="${i}" data-k="sets" value="${it.sets}" ${ro?"disabled":""}></label><label>Reps<input data-i="${i}" data-k="reps" value="${esc(it.reps)}" maxlength="20" ${ro?"disabled":""}></label><label>Carga kg<input type="number" min="0" step="0.5" data-i="${i}" data-k="load" value="${esc(it.load)}" ${ro?"disabled":""}></label><label>Descanso s<input type="number" min="0" max="900" data-i="${i}" data-k="rest" value="${it.rest}" ${ro?"disabled":""}></label></div></div>`).join(""):`<div class="card empty">Treino sem exercícios.</div>`)+
 (ro?"":`<div class="card row"><label style="flex:1;min-width:200px;margin:0">Adicionar exercício<select id="exsel">${gs.map(g=>`<optgroup label="${esc(g)}">${U.lib.filter(e=>e.muscle_group===g).map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join("")}</optgroup>`).join("")}</select></label><button class="btn" style="align-self:end" data-act="addex">Adicionar</button></div><div class="row"><button class="btn" data-act="save">Salvar rascunho</button><button class="btn p" data-act="pub">Publicar para o aluno</button></div>`);
}
async function saveDraft(){const b=U.b;
 await q(sb.from("workout_plans").update({name:b.name,goal:b.goal,notes:b.notes}).eq("id",b.plan));
 await q(sb.from("workout_plan_items").delete().eq("version_id",b.vid));
 if(b.items.length)await q(sb.from("workout_plan_items").insert(b.items.map((it,i)=>({version_id:b.vid,org_id:oid(),position:i,exercise_id:it.ex,sets:it.sets||1,reps:it.reps||"10",prescribed_load_kg:it.load===""?null:+it.load,rest_seconds:it.rest||0,notes:""}))));
}
const RS=`id,position,sets,reps,prescribed_load_kg,rest_seconds,exercise_library(name,muscle_group)`;
async function vMine(){
 const ses=await q(sb.from("workout_sessions").select("id,version_id").eq("org_id",oid()).eq("student_id",U.user.id).eq("status","in_progress").limit(1));
 if(ses.length)return runSession(ses[0]);
 const ps=await q(sb.from("workout_plans").select(`id,name,goal,notes,workout_plan_versions(id,version,status)`).eq("org_id",oid()).eq("student_id",U.user.id));
 const list=ps.map(p=>({p,v:(p.workout_plan_versions||[]).find(v=>v.status==="published")})).filter(x=>x.v);
 return `<h2>Meu treino</h2>`+(list.map(x=>`<div class="card"><h3>${esc(x.p.name)}</h3><p class="mute">${esc(x.p.goal)} · versão ${x.v.version}</p><button class="btn p" data-act="start" data-v="${x.v.id}">Iniciar treino</button></div>`).join("")||`<div class="card empty">Nenhum treino publicado para você ainda. Quando o personal publicar, ele aparece aqui.</div>`);
}
async function runSession(s){
 const v=await q(sb.from("workout_plan_versions").select(`id,workout_plans(name,notes),workout_plan_items(${RS})`).eq("id",s.version_id).maybeSingle());
 if(!v)return `<div class="card"><p>Esta sessão pertence a uma versão que foi substituída.</p><button class="btn d" data-act="discard" data-v="${s.id}">Descartar sessão</button></div>`;
 const lg=await q(sb.from("exercise_set_logs").select("id,item_id,set_number,done,performed_load_kg,performed_reps").eq("session_id",s.id));
 const logs={};lg.forEach(l=>logs[l.item_id+"."+l.set_number]={id:l.id,done:l.done,load:l.performed_load_kg??"",reps:l.performed_reps??""});
 U.s={id:s.id,logs,chain:Promise.resolve()};
 const items=v.workout_plan_items.sort((a,b)=>a.position-b.position);
 return `<h2>${esc(v.workout_plans.name)}</h2>${v.workout_plans.notes?`<p class="mute">Observação do profissional: ${esc(v.workout_plans.notes)}</p>`:""}`+items.map(it=>`<div class="card"><h3>${esc(it.exercise_library.name)}</h3><div class="mute">Prescrito: ${it.sets}×${esc(it.reps)}${it.prescribed_load_kg!=null?" · "+it.prescribed_load_kg+" kg":""} · descanso ${it.rest_seconds}s</div>`+
 Array.from({length:it.sets},(_,j)=>{const l=logs[it.id+"."+(j+1)]||{};return `<div class="set"><span class="mute">${j+1}</span><input type="number" step="0.5" min="0" placeholder="kg" data-l="${it.id}.${j+1}" data-k="load" value="${esc(l.load)}" aria-label="Carga série ${j+1}"><input type="number" min="0" placeholder="reps" data-l="${it.id}.${j+1}" data-k="reps" value="${esc(l.reps)}" aria-label="Repetições série ${j+1}"><input type="checkbox" data-l="${it.id}.${j+1}" data-k="done" data-rest="${it.rest_seconds}" ${l.done?"checked":""} aria-label="Série ${j+1} concluída"></div>`}).join("")+`</div>`).join("")+
 `<div class="row"><button class="btn p" data-act="finish" data-v="${s.id}">Finalizar treino</button><button class="btn d" data-act="discard" data-v="${s.id}">Descartar sessão</button></div>`;
}
function writeLog(key,patch){const [item,set]=key.split(".");U.s.chain=U.s.chain.then(async()=>{
 const L=U.s.logs[key]||(U.s.logs[key]={});Object.assign(L,patch);
 const row={done:!!L.done,performed_load_kg:L.load===""||L.load==null?null:+L.load,performed_reps:L.reps===""||L.reps==null?null:parseInt(L.reps)};
 try{if(L.id)await q(sb.from("exercise_set_logs").update(row).eq("id",L.id));else{const r=await q(sb.from("exercise_set_logs").insert({session_id:U.s.id,org_id:oid(),item_id:item,set_number:+set,...row}).select("id").single());L.id=r.id}}catch(e){}})}
async function vHist(){
 const ss=await q(sb.from("workout_sessions").select("id,started_at,finished_at").eq("org_id",oid()).eq("student_id",U.user.id).eq("status","finished").order("finished_at",{ascending:false}).limit(50));
 return `<h2>Histórico</h2>`+(ss.map(s=>`<div class="card row sp"><strong>${new Date(s.finished_at).toLocaleString("pt-BR")}</strong><span class="mute">Duração: ${fmt((new Date(s.finished_at)-new Date(s.started_at))/1000)}</span></div>`).join("")||`<div class="card empty">Nenhum treino concluído ainda.</div>`);
}
let tEnd=0,tInt=null;
function tstart(s){if(!s)return;tEnd=Date.now()+s*1000;$("#timer").classList.add("on");clearInterval(tInt);tInt=setInterval(()=>{const r=Math.ceil((tEnd-Date.now())/1000);if(r<=0){tstop();toast("Descanso terminado");return}$("#tl").textContent="Descanso "+fmt(r)},250)}
function tstop(){clearInterval(tInt);$("#timer").classList.remove("on")}

document.addEventListener("click",async e=>{const x=e.target.closest("[data-act]");if(!x)return;const a=x.dataset.act,v=x.dataset.v,b=U.b;
 try{
 if(a==="tab"){if(b&&U.tab==="plans"&&!confirm("Sair do montador? Alterações não salvas serão perdidas."))return;U.b=null;U.tab=v;nav()}
 else if(a==="mode"){U.mode=U.mode==="login"?"signup":"login";show(authScreen())}
 else if(a==="toggle"){await q(sb.from("organization_members").update({active:x.dataset.a!=="true"}).eq("org_id",oid()).eq("user_id",v));view()}
 else if(a==="link"){const t=document.querySelector(`[data-trsel="${v}"]`).value;await q(sb.from("trainer_student_relationships").insert({org_id:oid(),trainer_id:t,student_id:v}));toast("Aluno vinculado.");view()}
 else if(a==="open")await openPlan(v);
 else if(a==="back"){if(!confirm("Voltar? Alterações não salvas serão perdidas."))return;U.b=null;view()}
 else if(a==="addex"){const id=$("#exsel").value,e2=U.lib.find(z=>z.id===id);b.items.push({ex:id,name:e2.name,sets:3,reps:"10",load:"",rest:60});view()}
 else if(a==="up"||a==="dn"){const i=+v,j=a==="up"?i-1:i+1;[b.items[i],b.items[j]]=[b.items[j],b.items[i]];view()}
 else if(a==="rm"){b.items.splice(+v,1);view()}
 else if(a==="save"){await saveDraft();toast("Rascunho salvo.")}
 else if(a==="pub"){if(!b.items.length)return toast("Adicione ao menos um exercício antes de publicar.");await saveDraft();await q(sb.rpc("publish_workout_version",{_version:b.vid}));toast("Publicado. O aluno já pode ver o treino.");U.b=null;view()}
 else if(a==="newver"){await q(sb.rpc("create_workout_version",{_plan:b.plan}));await openPlan(b.plan)}
 else if(a==="start"){await q(sb.from("workout_sessions").insert({org_id:oid(),student_id:U.user.id,version_id:v}));view()}
 else if(a==="finish"){await U.s.chain;if(!confirm("Finalizar o treino? Não será possível editar depois."))return;await q(sb.from("workout_sessions").update({status:"finished"}).eq("id",v));tstop();toast("Treino finalizado.");U.tab="hist";nav()}
 else if(a==="discard"){if(!confirm("Descartar esta sessão?"))return;await q(sb.from("workout_sessions").update({status:"discarded"}).eq("id",v));tstop();view()}
 else if(a==="tstop")tstop();
 }catch(err){console.error(err)}
});
document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target,k=f.dataset.form;if(!k)return;
 try{
 if(k==="cfg"){ls.s("evx_url",f.u.value.trim());ls.s("evx_key",f.k.value.trim());location.reload()}
 else if(k==="auth"){const em=f.email.value.trim(),pw=f.pw.value;
  if(U.mode==="signup"){const r=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:f.name.value.trim()},emailRedirectTo:location.href.split("#")[0]}});
   if(r.error)return toast(r.error.message);
   if(!r.data.session){U.mode="login";show(authScreen());return toast("Conta criada. Confirme o e-mail e depois entre.")}
   U.user=r.data.user}
  else{const r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error)return toast("E-mail ou senha incorretos.");U.user=r.data.user}
  route()}
 else if(k==="org"){const id=await q(sb.rpc("create_organization",{_name:f.n.value}));U.org={org_id:id};U.tab=null;toast("Organização criada.");route()}
 else if(k==="member"){await q(sb.from("organization_members").insert({org_id:oid(),user_id:f.id.value.trim(),role:f.role.value}));toast("Pessoa adicionada.");view()}
 else if(k==="plan"){const p=await q(sb.from("workout_plans").insert({org_id:oid(),trainer_id:U.user.id,student_id:f.s.value,name:f.n.value.trim()}).select("id").single());
  await q(sb.rpc("create_workout_version",{_plan:p.id}));U.plans=await q(sb.from("workout_plans").select("id,name,goal,notes,student_id,workout_plan_versions(version,status)").eq("id",p.id));await openPlan(p.id)}
 }catch(err){console.error(err)}
});
document.addEventListener("input",e=>{const t=e.target;
 if(t.dataset.b&&U.b)U.b[t.dataset.b]=t.value;
 else if(t.dataset.i!==undefined&&U.b){const it=U.b.items[+t.dataset.i],k=t.dataset.k;it[k]=(k==="sets"||k==="rest")?Math.max(0,parseInt(t.value)||0):t.value}
});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.l&&U.s){const k=t.dataset.k;if(k==="done"){writeLog(t.dataset.l,{done:t.checked});if(t.checked)tstart(+t.dataset.rest)}else writeLog(t.dataset.l,{[k]:t.value})}
 else if(t.hasAttribute("data-org")){U.org=U.mems.find(m=>m.org_id===t.value);U.tab=null;U.b=null;nav()}
});
$("#out").onclick=async()=>{await sb.auth.signOut();U={mode:"login",user:null,mems:[],org:null,tab:null,b:null,s:null,plans:[],lib:[]};tstop();route()};
init();
</script>
</body>
